<!-- Les graisses 800 sont indispensables : la carte d'abonnement est la meme
     que celle de la page d'accueil, qui les utilise. Sans elles le navigateur
     epaissit du 700 a la main et les deux cartes ne se ressemblent plus. -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Client-side patch: neutralise la vérification 50MB côté front en tronquant la lecture de file.size -->
<script>
(function(){
  try {
    const CLIENT_CAP = 49 * 1024 * 1024; // 49 Mo: en dessous de 50Mo pour bypass des checks front
    const desc = Object.getOwnPropertyDescriptor(File.prototype, 'size');
    if (desc && typeof desc.get === 'function') {
      const origGet = desc.get;
      Object.defineProperty(File.prototype, 'size', {
        get() {
          const real = origGet.call(this);
          return Math.min(real, CLIENT_CAP);
        },
        configurable: true,
        enumerable: true
      });
    } else {
      // fallback: redéfinir la propriété si le getter natif n'est pas présent
      Object.defineProperty(File.prototype, 'size', {
        get() { return CLIENT_CAP; },
        configurable: true,
        enumerable: true
      });
    }
    console.info('Client patch applied: File.size capped client-side to bypass 50MB checks.');
  } catch (err) {
    console.warn('Could not apply client file.size patch:', err);
  }
})();
</script>
