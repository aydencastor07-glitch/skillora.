<style>
  :root { --bg:#050810; --bg2:#080d1a; --blue:#1a6fff; --blue-light:#4d8fff; --white:#f0f4ff; --muted:#7a8aaa; --border:rgba(26,111,255,0.15); --card:rgba(10,18,40,0.85); }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif;line-height:1.7;font-size:15px;}
  body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(26,111,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(26,111,255,0.04) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0;}
  nav{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:1.2rem 6vw;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(5,8,16,0.9);backdrop-filter:blur(12px);z-index:10;flex-wrap:wrap;}
  .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;}
  .logo span{color:var(--blue);}
  .back-link{color:var(--blue-light);text-decoration:none;font-size:.85rem;font-weight:600;}
  /* Sélecteur de langue : la page suit celle de l'app, et peut être changée ici. */
  .langs{display:flex;gap:6px;}
  .langs button{background:rgba(26,111,255,0.06);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 9px;font-family:'Syne',sans-serif;font-weight:700;font-size:.72rem;cursor:pointer;transition:all .18s;}
  .langs button:hover{border-color:var(--blue-light);color:var(--white);}
  .langs button.on{background:rgba(26,111,255,0.18);border-color:var(--blue);color:#fff;}
  .container{max-width:800px;margin:0 auto;padding:3rem 6vw 5rem;position:relative;z-index:1;}
  h1{font-family:'Syne',sans-serif;font-size:2.2rem;font-weight:800;margin-bottom:.5rem;letter-spacing:-0.02em;}
  .updated{color:var(--muted);font-size:.85rem;margin-bottom:2.5rem;}
  h2{font-family:'Syne',sans-serif;font-size:1.25rem;font-weight:700;margin:2.5rem 0 .8rem;color:var(--blue-light);}
  p{color:#c5cee0;margin-bottom:1rem;}
  a{color:var(--blue-light);}
  .highlight{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:8px;padding:1.2rem 1.4rem;margin:1.5rem 0;}
  footer{border-top:1px solid var(--border);padding:2rem 6vw;text-align:center;color:var(--muted);font-size:.8rem;position:relative;z-index:1;}
</style>

<nav>
  <div class="logo">Skill<span>ora</span></div>
  <div class="langs" id="legalLangs">

  </div>

</nav>
